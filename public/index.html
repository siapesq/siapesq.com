<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2138" />

    <!-- Decodifica o redirecionamento do 404.html (fallback SPA do GitHub Pages):
         transforma "/?/siapreps" de volta em "/siapreps" antes do React carregar. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!-- Primárias de SEO -->
    <title>SIAPESQ | Inteligência Artificial em Pesquisa Ambiental</title>
    <meta
      name="description"
      content="Plataforma de inteligência artificial e monitoramento por satélite para pesca e meio ambiente: localize o pescado, acompanhe espécies e reduza custos e emissões. Conheça SIAPREPS, PhytoBloom e a Plataforma SIAPESQ."
    />
